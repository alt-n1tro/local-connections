# Prepares a release whenever the version in manifest.json changes on main.
#
# 1. Checks that manifest.json, versions.json and the files are consistent.
# 2. Creates GitHub artifact attestations for main.js, manifest.json and
#    styles.css (proof they came from this repository at this commit).
# 3. Creates a DRAFT release for that version with the three files attached.
#    If a draft for that version already exists (e.g. one made by hand with
#    "Draft a new release"), the files are attached to it instead. A published
#    release is never touched.
#
# Then open the draft on GitHub, write the release notes and click Publish.
# Don't attach or replace files by hand: they'd no longer match the attestations.
name: Prepare release

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch: # "Run workflow" button, e.g. to retry

permissions:
  contents: write      # create the draft release
  id-token: write      # sign the attestations
  attestations: write  # store the attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version and files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::manifest.json version \"$version\" isn't x.y.z"; exit 1
          fi
          if ! jq -e --arg v "$version" 'has($v)' versions.json > /dev/null; then
            echo "::error::versions.json has no entry for $version"; exit 1
          fi
          node --check main.js
          test -s styles.css
          # Releases with this version, drafts included (drafts have no tag yet,
          # so match on the tag name the release will get).
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$version\") | if .draft then \"draft\" else \"published\" end")
          drafts=$(printf '%s\n' "$found" | grep -cx draft || true)
          if printf '%s\n' "$found" | grep -qx published; then
            echo "::notice::$version is already published; nothing to do. Bump the version to make a new one."
            echo "action=skip" >> "$GITHUB_OUTPUT"
          elif [ "$drafts" -gt 1 ]; then
            echo "::error::There are $drafts drafts for $version. Delete all but one under Releases, then use Run workflow to retry."
            exit 1
          elif [ "$drafts" -eq 1 ]; then
            echo "::notice::A draft for $version already exists; attaching the files to it."
            echo "action=upload" >> "$GITHUB_OUTPUT"
          else
            echo "action=create" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Attest the release files
        if: steps.check.outputs.action != 'skip'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        if: steps.check.outputs.action == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "$VERSION" main.js manifest.json styles.css \
            --draft --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "Write the release notes here, then publish."

      - name: Attach files to the existing draft
        if: steps.check.outputs.action == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$VERSION\" and .draft) | .id")
          # Point the draft at this commit, then attach (replacing any old copies).
          # tag_name must be sent along: an update without it detaches a draft
          # from its tag, and the release then publishes as "untagged-…".
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -f tag_name="$VERSION" -f target_commitish="$GITHUB_SHA" > /dev/null
          for f in main.js manifest.json styles.css; do
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq ".[] | select(.name == \"$f\") | .id")
            [ -n "$old" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$f" \
              -H "Content-Type: application/octet-stream" --input "$f" > /dev/null
          done
          echo "Attached main.js, manifest.json and styles.css to the $VERSION draft."
